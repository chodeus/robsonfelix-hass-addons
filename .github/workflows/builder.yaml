name: Builder

on:
  # `push` stays path-filtered: this trigger PUBLISHES to GHCR, and a docs- or
  # playwright-only commit must not re-push an already-released claudecode tag
  # under a new digest.
  push:
    branches: [main]
    paths:
      - claudecode/**
      - .github/workflows/builder.yaml
  # `pull_request` is deliberately NOT path-filtered. All three jobs here are
  # required status checks on main, and a filtered workflow simply never reports
  # them — so any PR touching no claudecode/ file (another add-on, renovate.json,
  # a root doc, this workflow) sat permanently BLOCKED with 0 checks and could
  # only land via `gh pr merge --admin`. Required checks and path filters cannot
  # coexist. PR builds pass --test, so this only costs CI minutes, never a push.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint add-on
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2
        with:
          path: ./claudecode

  build:
    name: Build ${{ matrix.arch }}
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishes ghcr.io/chodeus/claudecode-{arch}:<version from config.yaml>.
      # PRs run with --test (build only, no push). The add-on keeps building locally on
      # users' machines until config.yaml's `image:` key is uncommented — only do that
      # after this workflow has published PUBLIC images for the release version.
      # DO NOT pin this action to a SHA. It derives the builder image tag from its own ref:
      #   input=$(echo "${{ github.action_path }}" | rev | cut -d"/" -f1 | rev)
      #   docker pull ghcr.io/home-assistant/<arch>-builder:${input}
      # A digest pin makes that `docker pull ...-builder:<sha>` -> "manifest unknown".
      # renovate.json carries a matching pinDigests:false rule so Renovate stops proposing it.
      - name: Build ${{ matrix.arch }} add-on
        uses: home-assistant/builder@2025.03.0
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/claudecode \
            --image claudecode-{arch} \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon ${{ github.event_name == 'pull_request' && '--test' || '' }}
